services:
  - type: web
    name: lyftr-ai-chatbot-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: LLM_API_KEYS
        sync: false
      - key: LLM_MODEL
        value: gemini/gemini-2.0-flash
      - key: DATABASE_URL
        value: sqlite:////data/app.db
      - key: ALLOWED_ORIGINS
        sync: false
      - key: ENABLE_FAILURE_SIMULATION
        value: "true"
      - key: CACHE_ENABLED
        value: "true"
      - key: CACHE_TYPE
        value: local
